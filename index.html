<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Live</title>
<style>
:root{
  --bg:#050914;
  --bg2:#08111f;
  --line:rgba(255,255,255,.16);
  --muted:#aab6c8;
  --text:#fff;
  --live:#ff2638;
  --ok:#33da7a;
  --scroll:420s;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030610;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 50% -20%, rgba(28,88,180,.22), transparent 48%),
    linear-gradient(180deg,var(--bg2),var(--bg) 72%,#02050b)
}

/* HEADER */
header{
  height:14vh;min-height:92px;
  display:flex;align-items:center;gap:18px;
  padding:0 2vw;
  background:linear-gradient(180deg,#091323,#07101b);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 30px rgba(0,0,0,.30);
  z-index:10
}
.brand{
  min-width:300px;
  white-space:nowrap;
}
.brand h1{
  margin:0;
  font-size:clamp(30px,3.2vw,58px);
  line-height:.9;
  font-weight:1000;
  font-style:italic;
  letter-spacing:.03em;
  text-shadow:0 4px 16px rgba(0,0,0,.45)
}
.brand .tag{
  margin-top:9px;
  font-size:clamp(10px,.8vw,14px);
  color:#b6c7dc;
  font-weight:900;
  letter-spacing:.28em
}
.tabs{
  margin-left:auto;
  display:flex;align-items:center;gap:10px
}
.tab, .utility{
  height:54px;
  border:1px solid #496482;
  background:linear-gradient(180deg,#10233a,#0a1524);
  color:#fff;border-radius:13px;
  padding:0 18px;
  font-size:clamp(14px,1.05vw,19px);
  font-weight:1000;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.22)
}
.tab.active{
  border-color:#3ca8ff;
  background:linear-gradient(180deg,#123b6d,#0b2444);
  box-shadow:0 0 0 2px rgba(42,153,255,.18),0 0 24px rgba(0,126,255,.35)
}
.tab.sec.active{border-color:#e0b229;box-shadow:0 0 0 2px rgba(224,178,41,.16),0 0 24px rgba(224,178,41,.25)}
.utility{height:48px;padding:0 14px;font-size:13px}
.clock{
  padding-left:18px;
  border-left:1px solid rgba(255,255,255,.25);
  min-width:132px;
  text-align:right;
  color:#d6e2ef;
  font-size:clamp(15px,1vw,19px);
  font-weight:1000;
  line-height:1.3
}

/* MAIN SCOREBOARD */
main{
  flex:1;min-height:0;
  position:relative;
  overflow:hidden;
  padding:18px 0 14px;
}
.viewport{
  position:absolute;inset:18px 0 14px;
  overflow:hidden;
}
.track{
  height:100%;
  display:flex;
  width:max-content;
  animation:scroll var(--scroll) linear infinite;
  will-change:transform
}
.track.paused{animation-play-state:paused}
.group{
  height:100%;
  display:flex;
  width:max-content;
  gap:14px;
  padding-left:14px
}

/* CARD */
.card{
  --away:#26394f;
  --home:#243f6f;
  width:340px;
  height:100%;
  min-height:360px;
  position:relative;
  flex:none;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.22);
  background:#0b1320;
  box-shadow:0 18px 42px rgba(0,0,0,.34);
}
.card.live{
  border-color:#ff4856;
  box-shadow:0 0 0 1px rgba(255,42,57,.20),0 0 26px rgba(255,42,57,.24),0 18px 42px rgba(0,0,0,.34)
}
.card.live:after{
  content:"";
  position:absolute;inset:0;border-radius:18px;
  border:2px solid rgba(255,42,57,.55);
  animation:livePulse 1.65s ease-in-out infinite;
  pointer-events:none
}
.card-head{
  height:78px;
  padding:10px 14px;
  background:
    linear-gradient(90deg,
      color-mix(in srgb,var(--away) 78%,#050913) 0 50%,
      color-mix(in srgb,var(--home) 78%,#050913) 50% 100%);
  border-bottom:1px solid rgba(255,255,255,.14);
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  align-items:center;
  z-index:2
}
.badge{
  padding:7px 10px;
  border-radius:9px;
  background:rgba(2,7,13,.68);
  border:1px solid rgba(255,255,255,.24);
  font-size:15px;
  font-weight:1000;
  letter-spacing:.05em;
  white-space:nowrap
}
.badge.live{
  background:linear-gradient(180deg,#ff3043,#bb1020);
  border-color:#ff6a75;
  box-shadow:0 0 18px rgba(255,38,56,.35)
}
.badge.live .dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:white;margin-right:6px;
  animation:dotPulse 1s ease-in-out infinite
}
.card-meta{
  text-align:right;
  min-width:0;
  line-height:1.28
}
.status{
  font-size:18px;
  font-weight:1000;
  white-space:nowrap
}
.network{
  margin-top:4px;
  color:#d3dce8;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}

/* TWO TEAM PANELS */
.matchup{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:0
}
.team{
  position:relative;
  min-width:0;
  padding:22px 14px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden
}
.team.away{
  background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.11),transparent 32%),
    linear-gradient(180deg,color-mix(in srgb,var(--away) 88%,#030610),color-mix(in srgb,var(--away) 54%,#02040a))
}
.team.home{
  background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.11),transparent 32%),
    linear-gradient(180deg,color-mix(in srgb,var(--home) 88%,#030610),color-mix(in srgb,var(--home) 54%,#02040a))
}
.team + .team{border-left:1px solid rgba(255,255,255,.16)}
.watermark{
  position:absolute;
  width:170px;height:170px;
  object-fit:contain;
  opacity:.075;
  filter:grayscale(1) brightness(2.8);
  bottom:20px
}
.logo-wrap{
  width:112px;height:112px;
  display:grid;place-items:center;
  border-radius:22px;
  background:rgba(3,7,12,.22);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 0 24px rgba(255,255,255,.035);
  z-index:2
}
.logo{width:94px;height:94px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.40))}
.rankname{
  margin-top:14px;
  z-index:2;
  font-size:clamp(22px,1.6vw,31px);
  line-height:1;
  font-weight:1000;
  white-space:nowrap
}
.rank{
  color:#ffe45c;
  font-size:.63em;
  margin-right:5px;
  vertical-align:top
}
.record{
  z-index:2;
  margin-top:8px;
  color:#edf2f7;
  font-size:15px;
  font-weight:900
}
.score{
  z-index:2;
  margin-top:12px;
  font-size:clamp(52px,4.4vw,82px);
  line-height:.82;
  font-weight:1000;
  text-shadow:0 5px 18px rgba(0,0,0,.42);
  font-variant-numeric:tabular-nums
}
.team.loser{filter:saturate(.55) brightness(.62)}
.team.winner .score{color:#fff36a}
.team.winner{box-shadow:inset 0 -5px 0 rgba(255,235,82,.65)}
.possession{
  z-index:4;
  position:absolute;
  bottom:14px;
  right:10px;
  width:30px;height:21px;
  border-radius:55% 55% 55% 55% / 70% 70% 70% 70%;
  background:#8d4519;
  border:1px solid rgba(255,255,255,.7);
  transform:rotate(-24deg);
  box-shadow:0 3px 7px rgba(0,0,0,.35)
}
.possession:before{
  content:"";
  position:absolute;
  width:12px;height:2px;
  background:#fff;
  left:8px;top:9px
}
.possession:after{
  content:"";
  position:absolute;
  width:2px;height:8px;
  background:#fff;
  left:13px;top:6px
}

/* FOOT STRIP IN CARD */
.card-foot{
  height:46px;
  display:flex;align-items:center;justify-content:center;
  gap:8px;
  padding:0 10px;
  background:rgba(3,7,13,.96);
  border-top:1px solid rgba(255,255,255,.14);
  color:#d8e2ec;
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}

/* TOP 25 BAR */
.bottom{
  height:8vh;min-height:58px;
  display:flex;align-items:center;
  border-top:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,#06101c,#050a11);
  z-index:10
}
.top25label{
  min-width:118px;
  height:100%;
  display:flex;align-items:center;justify-content:center;
  border-right:1px solid rgba(255,255,255,.18);
  font-size:20px;font-weight:1000;
  color:#e9f2ff
}
.miniwrap{
  flex:1;overflow:hidden;height:100%;
  position:relative
}
.minitrack{
  height:100%;
  display:flex;align-items:center;
  width:max-content;
  animation:miniscroll 95s linear infinite
}
.minigroup{display:flex;align-items:center;width:max-content}
.mini{
  height:100%;
  display:flex;align-items:center;gap:9px;
  padding:0 24px;
  border-right:1px solid rgba(255,255,255,.16);
  font-weight:1000;white-space:nowrap
}
.minilogo{width:32px;height:32px;object-fit:contain}
.minirank{font-size:12px;color:#ffd95b}
.miniteam{font-size:15px}
.miniscore{font-size:25px}
.ministatus{font-size:12px;color:#b9c6d5;margin-left:4px}
.health{
  padding:0 18px;
  white-space:nowrap;
  font-size:12px;
  color:#c8d2df;
  font-weight:800
}
.healthdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px}
.healthdot.err{background:var(--live)}

.empty{
  width:100vw;
  display:grid;place-items:center;
  color:#b6c3d2;
  font-size:34px;font-weight:1000
}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes miniscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes livePulse{0%,100%{opacity:.28}50%{opacity:1}}
@keyframes dotPulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}

@media(max-width:1100px){
  .brand{min-width:240px}
  .brand h1{font-size:28px}
  .tag{display:none}
  .tab,.utility{height:46px;padding:0 12px;font-size:12px}
  .clock{display:none}
  .card{width:300px}
  .logo-wrap{width:96px;height:96px}
  .logo{width:80px;height:80px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>FOOTBALL LIVE</h1>
    <div class="tag">ALL GAMES • ALL SEASON</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="allBtn">ALL</button>
    <button class="tab" id="nflBtn">🏈 NFL</button>
    <button class="tab" id="cfbBtn">CFB</button>
    <button class="tab sec" id="secBtn">SEC</button>
    <button class="utility" id="pauseBtn">PAUSE</button>
    <button class="utility" id="speedBtn">0.25×</button>
    <button class="utility" id="fullBtn">FULLSCREEN</button>
  </div>

  <div class="clock" id="clock">--</div>
</header>

<main>
  <div class="viewport">
    <div class="track" id="track"><div class="empty">Loading football…</div></div>
  </div>
</main>

<div class="bottom">
  <div class="top25label">TOP 25</div>
  <div class="miniwrap">
    <div class="minitrack" id="miniTrack"></div>
  </div>
  <div class="health" id="health"><span class="healthdot"></span>Live feeds connected</div>
</div>

<script>
(() => {
  const NFL_URL='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100';
  const CFB_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=200';
  const SEC_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&limit=100';

  let nfl=[],cfb=[],sec=[];
  let mode='all', paused=false;

  const speeds=[
    {label:'0.05×',sec:900},
    {label:'0.10×',sec:650},
    {label:'0.25×',sec:420},
    {label:'0.5×',sec:260},
    {label:'1×',sec:150}
  ];
  let speedIndex=2;

  const $=id=>document.getElementById(id);
  const track=$('track');
  const miniTrack=$('miniTrack');

  function esc(v=''){
    return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function rankOf(c){
    const r=c?.curatedRank?.current;
    return Number.isFinite(r)&&r>0&&r<=25?r:null;
  }
  function logoOf(c){
    const t=c?.team||{};
    return t.logo||t?.logos?.[0]?.href||'';
  }
  function colorOf(c){
    const raw=c?.team?.color||c?.team?.alternateColor||'31445a';
    return '#'+String(raw).replace('#','');
  }
  function recordOf(c){return c?.records?.[0]?.summary||''}
  function spreadOf(comp){
    const o=comp?.odds?.[0];
    return o?(o.details||''):'';
  }
  function hasPossession(comp,c){
    const p=comp?.situation?.possession;
    return !!p&&(p===c?.id||p===c?.team?.id);
  }
  function normalize(ev,league){
    const comp=ev?.competitions?.[0]||{};
    const teams=comp.competitors||[];
    const away=teams.find(t=>t.homeAway==='away')||teams[0]||{};
    const home=teams.find(t=>t.homeAway==='home')||teams[1]||{};
    const state=ev?.status?.type?.state||'pre';
    const completed=!!ev?.status?.type?.completed;
    return {
      ev,comp,away,home,league,state,completed,
      live:state==='in'&&!completed,
      start:new Date(ev?.date),
      detail:ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'',
      network:comp?.broadcasts?.[0]?.names?.[0]||''
    };
  }
  function statusOf(x){
    if(x.state==='pre'){
      return x.start.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' • '+
        x.start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    }
    if(x.completed)return 'FINAL';
    return x.detail||'LIVE';
  }
  function numericScore(c){
    const s=parseFloat(c?.score);
    return Number.isFinite(s)?s:null;
  }
  function resultClasses(x){
    if(!x.completed)return {away:'',home:''};
    const a=numericScore(x.away),h=numericScore(x.home);
    if(a===null||h===null||a===h)return {away:'',home:''};
    return a>h?{away:'winner',home:'loser'}:{away:'loser',home:'winner'};
  }
  function teamHtml(c,x,side,resultClass){
    const t=c?.team||{};
    const logo=logoOf(c);
    const rank=rankOf(c);
    const abbr=t.abbreviation||t.shortDisplayName||t.displayName||'TBD';
    const score=(c?.score!==undefined&&c?.score!==null&&c?.score!=='')?c.score:'—';
    const poss=hasPossession(x.comp,c);
    return `<div class="team ${side} ${resultClass}">
      ${logo?`<img class="watermark" src="${esc(logo)}" alt="">`:''}
      <div class="logo-wrap">${logo?`<img class="logo" src="${esc(logo)}" alt="">`:''}</div>
      <div class="rankname">${rank?`<span class="rank">${rank}</span>`:''}${esc(abbr)}</div>
      <div class="record">${esc(recordOf(c)||'')}</div>
      <div class="score">${esc(score)}</div>
      ${poss?'<div class="possession" title="Possession"></div>':''}
    </div>`;
  }
  function cardHtml(x){
    const rc=resultClasses(x);
    const spread=spreadOf(x.comp);
    const headBadge=x.live
      ? `<div class="badge live"><span class="dotlive"></span>LIVE</div>`
      : `<div class="badge">${esc(x.league)}</div>`;
    return `<article class="card ${x.live?'live':''}" style="--away:${esc(colorOf(x.away))};--home:${esc(colorOf(x.home))}">
      <div class="card-head">
        ${headBadge}
        <div class="card-meta">
          <div class="status">${esc(statusOf(x))}</div>
          <div class="network">${esc([x.network,spread].filter(Boolean).join(' • '))}</div>
        </div>
      </div>
      <div class="matchup">
        ${teamHtml(x.away,x,'away',rc.away)}
        ${teamHtml(x.home,x,'home',rc.home)}
      </div>
      <div class="card-foot">${esc(x.live?x.detail:(x.completed?'FINAL':spread||x.network||''))}</div>
    </article>`;
  }
  function priority(x){
    if(x.live)return 0;
    if(x.state==='pre')return 1;
    return 2;
  }
  function currentGames(){
    let arr=[];
    if(mode==='all'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    }else if(mode==='nfl'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
    }else if(mode==='cfb'){
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    }else{
      arr.push(...sec.map(e=>normalize(e,'SEC')));
    }
    const seen=new Set();
    arr=arr.filter(x=>{
      const id=x.ev?.id||`${x.start}-${x.away?.team?.id}-${x.home?.team?.id}`;
      if(seen.has(id))return false;
      seen.add(id);return true;
    });
    arr.sort((a,b)=>priority(a)-priority(b)||a.start-b.start);
    return arr;
  }
  function miniHtml(x){
    const a=x.away,h=x.home;
    const ar=rankOf(a),hr=rankOf(h);
    const al=logoOf(a),hl=logoOf(h);
    return `<div class="mini">
      ${al?`<img class="minilogo" src="${esc(al)}" alt="">`:''}
      <span class="minirank">${ar||''}</span>
      <span class="miniteam">${esc(a?.team?.abbreviation||'')}</span>
      <span class="miniscore">${esc(a?.score||'—')}</span>
      <span>•</span>
      ${hl?`<img class="minilogo" src="${esc(hl)}" alt="">`:''}
      <span class="minirank">${hr||''}</span>
      <span class="miniteam">${esc(h?.team?.abbreviation||'')}</span>
      <span class="miniscore">${esc(h?.score||'—')}</span>
      <span class="ministatus">${esc(x.completed?'FINAL':x.live?x.detail:statusOf(x))}</span>
    </div>`;
  }
  function renderMain(){
    const arr=currentGames();
    if(!arr.length){
      track.innerHTML='<div class="empty">No games in this scoreboard window.</div>';
      track.style.animation='none';return;
    }
    const cards=arr.map(cardHtml).join('');
    track.innerHTML=`<div class="group">${cards}</div><div class="group" aria-hidden="true">${cards}</div>`;
    track.style.animation='';
    track.classList.toggle('paused',paused);
  }
  function renderMini(){
    let arr=cfb.map(e=>normalize(e,'CFB'))
      .filter(x=>rankOf(x.away)||rankOf(x.home))
      .sort((a,b)=>priority(a)-priority(b)||a.start-b.start)
      .slice(0,20);
    if(!arr.length){
      miniTrack.innerHTML='<div class="mini"><span class="miniteam">No Top 25 games in current feed</span></div>';
      return;
    }
    const items=arr.map(miniHtml).join('');
    miniTrack.innerHTML=`<div class="minigroup">${items}</div><div class="minigroup" aria-hidden="true">${items}</div>`;
  }
  function setMode(m){
    mode=m;
    ['allBtn','nflBtn','cfbBtn','secBtn'].forEach(id=>$(id).classList.remove('active'));
    $({all:'allBtn',nfl:'nflBtn',cfb:'cfbBtn',sec:'secBtn'}[m]).classList.add('active');
    renderMain();
  }
  function setSpeed(){
    const s=speeds[speedIndex];
    document.documentElement.style.setProperty('--scroll',s.sec+'s');
    $('speedBtn').textContent=s.label;
  }
  async function get(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
  async function refresh(){
    const r=await Promise.allSettled([get(NFL_URL),get(CFB_URL),get(SEC_URL)]);
    let ok=0;
    if(r[0].status==='fulfilled'){nfl=r[0].value?.events||[];ok++}
    if(r[1].status==='fulfilled'){cfb=r[1].value?.events||[];ok++}
    if(r[2].status==='fulfilled'){sec=r[2].value?.events||[];ok++}
    $('health').innerHTML=ok===3
      ? '<span class="healthdot"></span>Live feeds connected'
      : '<span class="healthdot err"></span>One or more feeds unavailable';
    renderMain();renderMini();
  }

  $('allBtn').onclick=()=>setMode('all');
  $('nflBtn').onclick=()=>setMode('nfl');
  $('cfbBtn').onclick=()=>setMode('cfb');
  $('secBtn').onclick=()=>setMode('sec');
  $('pauseBtn').onclick=()=>{
    paused=!paused;
    $('pauseBtn').textContent=paused?'RESUME':'PAUSE';
    track.classList.toggle('paused',paused);
  };
  $('speedBtn').onclick=()=>{
    speedIndex=(speedIndex+1)%speeds.length;
    setSpeed();
  };
  $('fullBtn').onclick=async()=>{
    try{
      if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  };
  setInterval(()=>{
    const d=new Date();
    $('clock').innerHTML=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}).toUpperCase()+'<br>'+
      d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  },1000);

  setInterval(refresh,30000);
  setSpeed();
  refresh();
})();
</script>
</body>
</html>
