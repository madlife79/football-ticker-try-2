<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Live Ticker</title>
<style>
:root{
  --bg:#03050a;
  --text:#ffffff;
  --muted:#c0c9d6;
  --line:rgba(255,255,255,.17);
  --live:#ff3b30;
  --ok:#38d47a;
  --ticker-speed:260s;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:
    radial-gradient(circle at 50% -20%, rgba(42,83,150,.18), transparent 44%),
    linear-gradient(180deg,#070b13,#03050a 78%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{display:flex;flex-direction:column}

/* HEADER */
.top{
  height:11.5vh;min-height:82px;
  display:flex;align-items:center;gap:18px;
  padding:0 2vw;
  background:rgba(5,8,14,.96);
  border-bottom:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 30px rgba(0,0,0,.28);
  z-index:5;
}
.title-wrap{display:flex;align-items:center;gap:12px;white-space:nowrap}
.ball{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#d66a1f,#7c2c0c);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.35);
  font-size:28px;
}
.title{
  font-size:clamp(30px,3vw,54px);
  font-weight:1000;
  letter-spacing:.035em;
}
.controls{margin-left:auto;display:flex;align-items:center;gap:10px}
button{
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(180deg,#202a38,#121821);
  color:white;border-radius:13px;
  padding:12px 17px;
  font-size:clamp(13px,1vw,18px);
  font-weight:1000;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 12px rgba(0,0,0,.2)
}
button:hover{transform:translateY(-1px)}
button.active{
  background:linear-gradient(180deg,#ffffff,#dfe7f1);
  color:#080b10;border-color:#fff
}
.clock{
  min-width:104px;text-align:right;
  font-size:20px;font-weight:1000;color:#d4dbe5;
  font-variant-numeric:tabular-nums
}

/* MAIN */
.ticker{
  flex:1;min-height:0;position:relative;overflow:hidden;
  display:flex;align-items:center
}
.viewport{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center}
.track{
  display:flex;width:max-content;
  animation:scroll var(--ticker-speed) linear infinite;
  will-change:transform
}
.track.paused{animation-play-state:paused}
.group{display:flex;align-items:center;width:max-content}

/* MATCHUP CARD */
.game{
  --away:#465362;
  --home:#233a5f;
  position:relative;
  width:1040px;
  height:64vh;
  min-height:390px;
  max-height:660px;
  margin-right:28px;
  border-radius:32px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.22);
  background:
    linear-gradient(90deg,
      color-mix(in srgb,var(--away) 78%,#02050b) 0%,
      color-mix(in srgb,var(--away) 62%,#02050b) 42%,
      #090d15 49.5%,
      #090d15 50.5%,
      color-mix(in srgb,var(--home) 62%,#02050b) 58%,
      color-mix(in srgb,var(--home) 78%,#02050b) 100%);
  box-shadow:
    0 28px 70px rgba(0,0,0,.46),
    inset 0 0 65px rgba(255,255,255,.025);
}
.game:before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 18% 55%, rgba(255,255,255,.12), transparent 27%),
    radial-gradient(circle at 82% 55%, rgba(255,255,255,.12), transparent 27%),
    linear-gradient(180deg,rgba(255,255,255,.05),transparent 22%,transparent 78%,rgba(0,0,0,.22));
  pointer-events:none
}
.game.live{
  border-color:rgba(255,78,78,.75);
  box-shadow:
    0 28px 70px rgba(0,0,0,.46),
    0 0 30px rgba(255,59,48,.2),
    inset 0 0 70px rgba(255,59,48,.035)
}
.game-meta{
  position:absolute;z-index:2;
  top:0;left:0;right:0;height:74px;
  padding:0 32px;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,.47),rgba(0,0,0,.10));
  border-bottom:1px solid rgba(255,255,255,.13)
}
.league-pill{
  justify-self:start;
  padding:7px 13px;border-radius:999px;
  background:rgba(5,8,14,.70);
  border:1px solid rgba(255,255,255,.24);
  font-size:18px;font-weight:1000;letter-spacing:.08em
}
.live-pill{
  padding:7px 14px;border-radius:999px;
  background:var(--live);color:#fff;
  font-size:18px;font-weight:1000;letter-spacing:.08em;
  box-shadow:0 0 20px rgba(255,59,48,.34)
}
.game-time{
  justify-self:center;
  font-size:clamp(18px,1.45vw,27px);
  font-weight:1000;letter-spacing:.02em;
  text-align:center
}
.broadcast{
  justify-self:end;
  font-size:clamp(15px,1.1vw,21px);
  color:#e8edf4;font-weight:900;
  text-align:right;white-space:nowrap
}

/* TEAM HALVES */
.game-main{
  position:absolute;z-index:2;
  left:0;right:0;top:74px;bottom:0;
  display:grid;grid-template-columns:1fr 118px 1fr;
  align-items:center;
  padding:22px 40px 28px
}
.team{
  min-width:0;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center
}
.logo-shell{
  width:160px;height:160px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.20);
  box-shadow:
    inset 0 0 35px rgba(255,255,255,.05),
    0 16px 35px rgba(0,0,0,.28);
  margin-bottom:18px;
  backdrop-filter:blur(2px)
}
.logo{
  width:132px;height:132px;object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.42))
}
.team-name{
  font-size:clamp(48px,4.5vw,84px);
  line-height:.95;
  font-weight:1000;
  letter-spacing:.015em;
  text-shadow:0 4px 16px rgba(0,0,0,.36);
  white-space:nowrap
}
.rank{
  display:inline-block;
  margin-right:8px;
  color:#ffe275;
  font-size:.48em;
  vertical-align:top;
  text-shadow:0 2px 10px rgba(0,0,0,.5)
}
.record{
  margin-top:12px;
  font-size:clamp(20px,1.5vw,28px);
  font-weight:900;color:#e5eaf1
}
.score{
  margin-top:12px;
  font-size:clamp(74px,7vw,126px);
  line-height:.85;
  font-weight:1000;
  font-variant-numeric:tabular-nums;
  text-shadow:0 5px 20px rgba(0,0,0,.4)
}

/* CENTER DIVIDER */
.center{
  height:76%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;
  border-left:1px solid rgba(255,255,255,.22);
  border-right:1px solid rgba(255,255,255,.22)
}
.vs{
  width:78px;height:78px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(180deg,#ffffff,#d9e1ea);
  color:#070a0f;
  border:4px solid rgba(255,255,255,.24);
  font-size:24px;font-weight:1000;
  box-shadow:0 10px 30px rgba(0,0,0,.35)
}
.center-status{
  max-width:105px;
  text-align:center;
  font-size:16px;
  line-height:1.2;
  color:#dce3eb;
  font-weight:900
}
.poss{
  margin-top:8px;
  padding:5px 9px;
  background:#ffd166;color:#1a1a1a;
  border-radius:999px;
  font-size:12px;font-weight:1000;
  letter-spacing:.06em
}

/* FOOTER */
.footer{
  height:7.5vh;min-height:54px;
  display:flex;align-items:center;gap:24px;
  padding:0 2vw;
  background:#070a10;
  border-top:1px solid rgba(255,255,255,.14);
  color:#c1c9d4;
  font-size:clamp(13px,1vw,17px);
  font-weight:800
}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px}
.dot.err{background:var(--live)}
.right{margin-left:auto}
.empty{padding-left:5vw;color:#b8c2cf;font-size:40px;font-weight:1000}
.toast{
  position:fixed;right:20px;bottom:72px;z-index:50;
  padding:13px 18px;border-radius:14px;
  background:#1b2330;border:1px solid #40506a;display:none
}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(max-width:1100px){
  .title{font-size:28px}.ball{display:none}
  button{padding:9px 10px;font-size:12px}
  .clock{display:none}
  .game{width:860px}
  .logo-shell{width:128px;height:128px}
  .logo{width:105px;height:105px}
  .game-main{grid-template-columns:1fr 98px 1fr;padding-left:28px;padding-right:28px}
}
</style>
</head>
<body>

<header class="top">
  <div class="title-wrap">
    <div class="ball">🏈</div>
    <div class="title">FOOTBALL LIVE</div>
  </div>
  <div class="controls">
    <button id="bothBtn" class="active">ALL</button>
    <button id="nflBtn">NFL</button>
    <button id="cfbBtn">COLLEGE</button>
    <button id="secBtn">SEC</button>
    <button id="top25Btn">TOP 25: OFF</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="speedBtn">SPEED: 0.5×</button>
    <button id="fullBtn">FULLSCREEN</button>
  </div>
  <div id="clock" class="clock">--:--</div>
</header>

<main class="ticker">
  <div class="viewport">
    <div id="track" class="track"><div class="empty">Loading football…</div></div>
  </div>
</main>

<footer class="footer">
  <span id="health"><span class="dot"></span>Connecting</span>
  <span id="updated">Last update: —</span>
  <span class="right">Updates every 30 seconds</span>
</footer>

<div id="toast" class="toast"></div>

<script>
(() => {
  const NFL_URL='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100';
  const CFB_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=200';
  const SEC_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&limit=100';
  const REFRESH_MS=30000;

  let nfl=[],cfb=[],sec=[];
  let mode='both',top25Only=false,paused=false;

  const speedSteps=[
    {label:'0.25×',seconds:420},
    {label:'0.5×',seconds:260},
    {label:'1×',seconds:150},
    {label:'2×',seconds:82},
    {label:'3×',seconds:55}
  ];
  let speedIndex=1;

  const $=id=>document.getElementById(id);
  const track=$('track');

  function esc(v=''){
    return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function rankOf(c){
    const r=c?.curatedRank?.current;
    return Number.isFinite(r)&&r>0&&r<=25?r:null;
  }
  function recordOf(c){return c?.records?.[0]?.summary||''}
  function rawColor(c){
    const raw=c?.team?.color||c?.team?.alternateColor||'465362';
    return '#'+raw.replace('#','');
  }
  function hasPossession(comp,c){
    const p=comp?.situation?.possession;
    return !!p&&(c?.id===p||c?.team?.id===p);
  }
  function spreadOf(comp){
    const o=comp?.odds?.[0];
    return o?(o.details||o.spread||''):'';
  }
  function normalize(ev,league){
    const comp=ev?.competitions?.[0]||{};
    const cs=comp.competitors||[];
    const away=cs.find(x=>x.homeAway==='away')||cs[0]||{};
    const home=cs.find(x=>x.homeAway==='home')||cs[1]||{};
    const state=ev?.status?.type?.state||'pre';
    const completed=!!ev?.status?.type?.completed;
    return {
      ev,comp,away,home,league,state,completed,
      live:state==='in'&&!completed,
      detail:ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'',
      start:new Date(ev?.date),
      broadcast:comp?.broadcasts?.[0]?.names?.[0]||''
    };
  }
  function statusText(x){
    if(x.state==='pre'){
      return x.start.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' • '+
        x.start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    }
    if(x.completed)return 'FINAL';
    return x.detail||'LIVE';
  }
  function teamBlock(c,comp){
    const t=c?.team||{};
    const logo=t.logo||t?.logos?.[0]?.href||'';
    const name=t.abbreviation||t.shortDisplayName||t.displayName||'TBD';
    const r=rankOf(c);
    const rec=recordOf(c);
    const score=(c?.score!==undefined&&c?.score!==null&&c?.score!=='')?c.score:'—';
    const poss=hasPossession(comp,c);
    return `<div class="team">
      <div class="logo-shell">${logo?`<img class="logo" src="${esc(logo)}" alt="">`:''}</div>
      <div class="team-name">${r?`<span class="rank">${r}</span>`:''}${esc(name)}</div>
      <div class="record">${esc(rec||t.shortDisplayName||'')}</div>
      <div class="score">${esc(score)}</div>
      ${poss?'<div class="poss">POSSESSION</div>':''}
    </div>`;
  }
  function gameCard(x){
    const spread=spreadOf(x.comp);
    const league=x.live?'<span class="live-pill">LIVE</span>':`<span class="league-pill">${esc(x.league)}</span>`;
    return `<article class="game ${x.live?'live':''}" style="--away:${esc(rawColor(x.away))};--home:${esc(rawColor(x.home))}">
      <div class="game-meta">
        <div>${league}</div>
        <div class="game-time">${esc(statusText(x))}</div>
        <div class="broadcast">${esc([x.broadcast,spread].filter(Boolean).join(' • '))}</div>
      </div>
      <div class="game-main">
        ${teamBlock(x.away,x.comp)}
        <div class="center">
          <div class="vs">${x.completed?'FT':x.live?'LIVE':'VS'}</div>
          <div class="center-status">${esc(x.live?x.detail:(spread||''))}</div>
        </div>
        ${teamBlock(x.home,x.comp)}
      </div>
    </article>`;
  }
  function priority(x){
    if(x.live)return 0;
    if(x.state==='pre')return 1;
    return 2;
  }
  function currentData(){
    let arr=[];
    if(mode==='both'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    }else if(mode==='nfl'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
    }else if(mode==='cfb'){
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    }else if(mode==='sec'){
      arr.push(...sec.map(e=>normalize(e,'SEC')));
    }

    if(top25Only&&mode!=='nfl'){
      arr=arr.filter(x=>x.league==='NFL'||rankOf(x.away)||rankOf(x.home));
    }

    const seen=new Set();
    arr=arr.filter(x=>{
      const id=x.ev?.id||`${x.start}-${x.away?.team?.id}-${x.home?.team?.id}`;
      if(seen.has(id))return false;
      seen.add(id);
      return true;
    });
    arr.sort((a,b)=>priority(a)-priority(b)||a.start-b.start);
    return arr;
  }
  function setSpeed(){
    const s=speedSteps[speedIndex];
    document.documentElement.style.setProperty('--ticker-speed',s.seconds+'s');
    $('speedBtn').textContent='SPEED: '+s.label;
  }
  function updateButtons(){
    ['bothBtn','nflBtn','cfbBtn','secBtn'].forEach(id=>$(id).classList.remove('active'));
    $({both:'bothBtn',nfl:'nflBtn',cfb:'cfbBtn',sec:'secBtn'}[mode]).classList.add('active');
    $('top25Btn').classList.toggle('active',top25Only);
    $('top25Btn').textContent=`TOP 25: ${top25Only?'ON':'OFF'}`;
    $('pauseBtn').classList.toggle('active',paused);
    $('pauseBtn').textContent=paused?'RESUME':'PAUSE';
  }
  function render(){
    updateButtons();
    const arr=currentData();
    if(!arr.length){
      track.innerHTML='<div class="empty">No games in the current scoreboard window.</div>';
      track.style.animation='none';
      return;
    }
    const cards=arr.map(gameCard).join('');
    track.innerHTML=`<div class="group">${cards}</div><div class="group" aria-hidden="true">${cards}</div>`;
    track.style.animation='';
    setSpeed();
    track.classList.toggle('paused',paused);
  }
  async function fetchJson(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
  async function refresh(){
    const results=await Promise.allSettled([fetchJson(NFL_URL),fetchJson(CFB_URL),fetchJson(SEC_URL)]);
    let ok=0;const failures=[];
    if(results[0].status==='fulfilled'){nfl=results[0].value?.events||[];ok++;}else failures.push('NFL');
    if(results[1].status==='fulfilled'){cfb=results[1].value?.events||[];ok++;}else failures.push('College');
    if(results[2].status==='fulfilled'){sec=results[2].value?.events||[];ok++;}else failures.push('SEC');

    if(ok){
      $('updated').textContent='Last update: '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
    }
    if(ok===3)$('health').innerHTML='<span class="dot"></span>Live feeds connected';
    else if(ok>0)$('health').innerHTML=`<span class="dot err"></span>${esc(failures.join(', '))} feed unavailable`;
    else $('health').innerHTML='<span class="dot err"></span>Feeds unavailable — check internet/browser';
    render();
  }
  function toast(msg){
    const t=$('toast');t.textContent=msg;t.style.display='block';
    setTimeout(()=>t.style.display='none',2400);
  }

  $('bothBtn').onclick=()=>{mode='both';render()};
  $('nflBtn').onclick=()=>{mode='nfl';render()};
  $('cfbBtn').onclick=()=>{mode='cfb';render()};
  $('secBtn').onclick=()=>{mode='sec';render()};
  $('top25Btn').onclick=()=>{top25Only=!top25Only;render()};
  $('pauseBtn').onclick=()=>{paused=!paused;render()};
  $('speedBtn').onclick=()=>{speedIndex=(speedIndex+1)%speedSteps.length;setSpeed()};
  $('fullBtn').onclick=async()=>{
    try{
      if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){toast('Fullscreen is blocked here. Use the browser fullscreen option.')}
  };

  setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);
  setInterval(refresh,REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  setSpeed();
  refresh();
})();
</script>
</body>
</html>
