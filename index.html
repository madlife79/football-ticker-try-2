<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Live Command Center</title>
<style>
:root{--bg:#030610;--line:rgba(255,255,255,.16);--text:#fff;--muted:#aab7c9;--live:#ff2a3b;--ok:#36d67d;--gold:#ffd84d;--scroll:420s}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030610;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,rgba(30,93,190,.24),transparent 47%),linear-gradient(180deg,#07111e,#030610 72%,#02040a)}button{font:inherit}.hidden{display:none!important}
header{height:14vh;min-height:94px;display:flex;align-items:center;gap:14px;padding:0 1.6vw;background:linear-gradient(180deg,#0a1424,#07101a);border-bottom:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.30);z-index:20;transition:transform .28s ease,opacity .28s ease}.chrome-hidden header{transform:translateY(-100%);opacity:0;pointer-events:none}.brand{min-width:210px;width:210px;height:82px;display:flex;align-items:center;justify-content:flex-start}.brand-logo{display:block;max-width:195px;max-height:76px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35))}.controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.control{height:50px;border:1px solid #44617e;background:linear-gradient(180deg,#10243a,#0a1625);color:#fff;border-radius:12px;padding:0 14px;font-size:clamp(12px,.92vw,16px);font-weight:1000;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.22)}.control:focus{outline:none;border-color:#73b8ff;box-shadow:0 0 0 3px rgba(61,159,255,.22),0 0 22px rgba(0,128,255,.22)}.control.active{background:linear-gradient(180deg,#1350a0,#0c2f61);border-color:#49a7ff;box-shadow:0 0 0 2px rgba(42,153,255,.16),0 0 22px rgba(0,126,255,.28)}.control.sec.active{border-color:#e5b72b;box-shadow:0 0 0 2px rgba(229,183,43,.18),0 0 24px rgba(229,183,43,.22)}.clock{padding-left:14px;border-left:1px solid rgba(255,255,255,.22);min-width:125px;text-align:right;color:#d6e2ef;font-size:clamp(14px,.95vw,18px);font-weight:1000;line-height:1.3}
main{flex:1;min-height:0;position:relative;overflow:hidden;padding:16px 0 12px}.viewport{position:absolute;inset:16px 0 12px;overflow:hidden}.track{height:100%;display:flex;width:max-content;animation:scroll var(--scroll) linear infinite;will-change:transform}.track.paused{animation-play-state:paused}.group{height:100%;display:flex;width:max-content;gap:14px;padding-left:14px}
.card{--away:#26394f;--home:#243f6f;width:342px;height:100%;min-height:350px;position:relative;flex:none;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:#0b1320;box-shadow:0 18px 42px rgba(0,0,0,.34)}.card.live{border-color:#ff4856;box-shadow:0 0 0 1px rgba(255,42,57,.20),0 0 26px rgba(255,42,57,.24),0 18px 42px rgba(0,0,0,.34)}.card.live:after{content:"";position:absolute;inset:0;border-radius:18px;border:2px solid rgba(255,42,57,.55);animation:livePulse 1.65s ease-in-out infinite;pointer-events:none}.card.redzone{border-color:#ffbf3f;box-shadow:0 0 0 2px rgba(255,191,63,.15),0 0 28px rgba(255,126,0,.24),0 18px 42px rgba(0,0,0,.34)}.card-head{height:82px;padding:10px 13px;background:linear-gradient(90deg,color-mix(in srgb,var(--away) 78%,#050913) 0 50%,color-mix(in srgb,var(--home) 78%,#050913) 50% 100%);border-bottom:1px solid rgba(255,255,255,.14);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;z-index:2}.badges{display:flex;flex-direction:column;gap:5px;align-items:flex-start}.badge{padding:6px 9px;border-radius:8px;background:rgba(2,7,13,.70);border:1px solid rgba(255,255,255,.24);font-size:14px;font-weight:1000;letter-spacing:.05em;white-space:nowrap}.badge.live{background:linear-gradient(180deg,#ff3043,#bb1020);border-color:#ff6a75;box-shadow:0 0 18px rgba(255,38,56,.35)}.badge.redzone{background:linear-gradient(180deg,#ffb11d,#c96f00);border-color:#ffd168;color:#140b00}.dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:white;margin-right:6px;animation:dotPulse 1s ease-in-out infinite}.conf-badge{padding:4px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.22);background:#0c1927;color:#dce8f6;font-size:11px;font-weight:1000;letter-spacing:.06em}.conf-badge.sec{background:#1b2d74;color:#ffd84a}.conf-badge.b1g{background:#004a89}.conf-badge.big12{background:#6f0f19}.conf-badge.acc{background:#163d78}.conf-badge.nfl{background:#163d78}.card-meta{text-align:right;min-width:0;line-height:1.25}.status{font-size:17px;font-weight:1000;white-space:nowrap}.network{margin-top:4px;color:#d4deea;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matchup{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}.team{position:relative;min-width:0;padding:20px 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.team.away{background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.11),transparent 31%),linear-gradient(180deg,color-mix(in srgb,var(--away) 90%,#030610),color-mix(in srgb,var(--away) 54%,#02040a))}.team.home{background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.11),transparent 31%),linear-gradient(180deg,color-mix(in srgb,var(--home) 90%,#030610),color-mix(in srgb,var(--home) 54%,#02040a))}.team+.team{border-left:1px solid rgba(255,255,255,.16)}.watermark{position:absolute;width:165px;height:165px;object-fit:contain;opacity:.072;filter:grayscale(1) brightness(2.8);bottom:18px}.logo-wrap{width:108px;height:108px;display:grid;place-items:center;border-radius:22px;background:rgba(3,7,12,.22);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 24px rgba(255,255,255,.035);z-index:2}.logo{width:91px;height:91px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.40))}.rankname{margin-top:12px;z-index:2;font-size:clamp(21px,1.55vw,30px);line-height:1;font-weight:1000;white-space:nowrap}.rank{color:#ffe45c;font-size:.62em;margin-right:5px;vertical-align:top}.record{z-index:2;margin-top:7px;color:#eef3f8;font-size:14px;font-weight:900}.score{z-index:2;margin-top:10px;font-size:clamp(49px,4.1vw,78px);line-height:.82;font-weight:1000;text-shadow:0 5px 18px rgba(0,0,0,.42);font-variant-numeric:tabular-nums}.team.loser{filter:saturate(.48) brightness(.58)}.team.winner .score{color:#fff36a}.team.winner{box-shadow:inset 0 -5px 0 rgba(255,235,82,.65)}.score.flash{animation:scoreFlash 2.2s ease-out}.possession{z-index:4;position:absolute;bottom:12px;right:10px;width:30px;height:21px;border-radius:55% / 70%;background:#8d4519;border:1px solid rgba(255,255,255,.78);transform:rotate(-24deg);box-shadow:0 3px 7px rgba(0,0,0,.35)}.possession:before{content:"";position:absolute;width:12px;height:2px;background:#fff;left:8px;top:9px}.possession:after{content:"";position:absolute;width:2px;height:8px;background:#fff;left:13px;top:6px}.favorite-star{position:absolute;top:8px;left:8px;z-index:5;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);color:#fff;font-size:17px;display:grid;place-items:center;cursor:pointer}.favorite-star.on{color:var(--gold);border-color:rgba(255,216,77,.55)}.favorite-star:focus{outline:2px solid #fff}.card-foot{height:54px;padding:0 10px;display:flex;align-items:center;justify-content:center;background:rgba(3,7,13,.96);border-top:1px solid rgba(255,255,255,.14);color:#d8e2ec;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{height:8vh;min-height:58px;display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#06101c,#050a11);z-index:15}.striplabel{min-width:126px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.18);font-weight:1000}.striplabel strong{font-size:19px}.striplabel span{font-size:10px;color:#9fb1c5;letter-spacing:.12em;margin-top:2px}.miniwrap{flex:1;overflow:hidden;height:100%;position:relative}.minitrack{height:100%;display:flex;align-items:center;width:max-content;animation:miniscroll 95s linear infinite}.minigroup{display:flex;align-items:center;width:max-content}.mini{height:100%;display:flex;align-items:center;gap:8px;padding:0 22px;border-right:1px solid rgba(255,255,255,.16);font-weight:1000;white-space:nowrap}.minilogo{width:30px;height:30px;object-fit:contain}.minirank{font-size:11px;color:#ffd95b}.miniteam{font-size:14px}.miniscore{font-size:23px}.ministatus{font-size:11px;color:#b9c6d5;margin-left:4px}.health{padding:0 16px;white-space:nowrap;font-size:11px;color:#c8d2df;font-weight:800}.healthdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.healthdot.err{background:var(--live)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px)}.modal.open{display:flex}.modal-card{width:min(980px,90vw);max-height:78vh;overflow:auto;background:linear-gradient(180deg,#101a29,#09111c);border:1px solid rgba(255,255,255,.20);border-radius:22px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.5)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.modal-head h2{margin:0;font-size:28px}.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.fav-team{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#0c1624;color:#fff;font-weight:900;cursor:pointer}.fav-team.on{border-color:#ffd84d;box-shadow:0 0 0 2px rgba(255,216,77,.15)}.fav-team img{width:34px;height:34px;object-fit:contain}.closebtn{height:42px;padding:0 14px;border-radius:10px;background:#182436;border:1px solid #4b6686;color:#fff;font-weight:1000}.empty{width:100vw;display:grid;place-items:center;color:#b6c3d2;font-size:34px;font-weight:1000}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes miniscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes livePulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes dotPulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@keyframes scoreFlash{0%{color:#fff;transform:scale(1)}20%{color:#7cff8f;transform:scale(1.18);text-shadow:0 0 28px rgba(79,255,123,.85)}100%{color:inherit;transform:scale(1)}}
@media(max-width:1100px){.brand{min-width:165px;width:165px;height:70px}.brand-logo{max-width:155px;max-height:64px}.control{height:44px;padding:0 10px;font-size:11px}.clock{display:none}.card{width:300px}.logo-wrap{width:94px;height:94px}.logo{width:79px;height:79px}.team-grid{grid-template-columns:repeat(3,1fr)}}

.nav-symbol{display:inline-grid;place-items:center;width:37px;height:37px;font-weight:1000;line-height:1}
.nav-symbol.nfl{clip-path:polygon(50% 0,91% 12%,86% 67%,50% 100%,14% 67%,9% 12%);background:#fff;color:#d71920;border:2px solid #1d4f91;font-size:12px;text-shadow:0 1px 0 #fff}
.nav-symbol.ncaa{border-radius:50%;background:#1674d1;color:#fff;border:2px solid #fff;font-size:9px;font-style:italic;letter-spacing:-.04em}
.nav-symbol.sec{border-radius:50%;background:#ffcf32;color:#183c88;border:3px solid #183c88;font-size:12px;box-shadow:inset 0 0 0 2px #ffcf32}
.control.icon-tab{width:54px;padding:0;display:inline-flex;align-items:center;justify-content:center}

.score-alert{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;overflow:hidden;background:#030610;color:#fff}
.score-alert.show{display:flex;animation:alertIn .25s ease-out}
.score-alert-bg{position:absolute;inset:-8%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.22),transparent 22%),linear-gradient(135deg,var(--alert-color,#173d75),#02050b 72%);transform:scale(1.05)}
.score-alert-grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:42px 42px;animation:gridMove 1.2s linear infinite}
.score-alert-lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 18px,rgba(255,255,255,.035) 18px 20px)}
.pixel-football{position:absolute;left:-14vw;bottom:16vh;width:120px;height:76px;border-radius:55% / 70%;background:#9a4f1e;border:6px solid #fff;transform:rotate(-20deg);box-shadow:0 0 0 6px rgba(0,0,0,.28),0 12px 30px rgba(0,0,0,.35);animation:footballFly 1.55s cubic-bezier(.18,.75,.25,1) forwards}
.pixel-football:before{content:"";position:absolute;left:43px;top:31px;width:34px;height:7px;background:#fff}
.pixel-football:after{content:"";position:absolute;left:57px;top:20px;width:7px;height:28px;background:#fff}
.alert-content{position:relative;z-index:3;width:min(1100px,92vw);text-align:center;display:flex;flex-direction:column;align-items:center;animation:contentPop .45s cubic-bezier(.2,1.25,.3,1)}
.alert-kicker{font-size:clamp(30px,4vw,68px);font-weight:1000;letter-spacing:.18em;color:#fff;text-shadow:0 0 22px rgba(255,255,255,.45),0 6px 20px rgba(0,0,0,.55);animation:kickerFlash .7s steps(2,end) 4}
.alert-logo-wrap{width:clamp(150px,20vw,300px);height:clamp(150px,20vw,300px);margin:18px 0 10px;border-radius:30px;display:grid;place-items:center;background:rgba(0,0,0,.24);border:3px solid rgba(255,255,255,.36);box-shadow:0 0 70px rgba(255,255,255,.15),inset 0 0 40px rgba(255,255,255,.08)}
.alert-logo{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.alert-team{font-size:clamp(52px,8vw,130px);line-height:.9;font-weight:1000;letter-spacing:.02em;text-shadow:0 7px 26px rgba(0,0,0,.55)}
.alert-score{margin-top:12px;font-size:clamp(48px,6vw,96px);font-weight:1000;color:#fff36a;text-shadow:0 5px 22px rgba(0,0,0,.5)}
.alert-sub{margin-top:10px;font-size:clamp(18px,2vw,34px);font-weight:900;color:#dce8f7;letter-spacing:.04em}
.alert-bars{position:absolute;left:0;right:0;bottom:0;height:14vh;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 80px,transparent 80px 110px);transform:skewY(-2deg)}
@keyframes alertIn{from{opacity:0}to{opacity:1}}
@keyframes contentPop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes kickerFlash{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes gridMove{from{transform:translateY(0)}to{transform:translateY(42px)}}
@keyframes footballFly{0%{left:-14vw;bottom:15vh;transform:rotate(-35deg) scale(.65)}45%{left:42vw;bottom:60vh;transform:rotate(240deg) scale(1.1)}100%{left:110vw;bottom:23vh;transform:rotate(650deg) scale(.7)}}
</style>
</head>

let nfl=[],cfb=[],sec=[];let mode=localStorage.getItem('footballMode')||'all';let paused=false;let saturdayMode=localStorage.getItem('saturdayMode')==='true';let closeGamesOnly=localStorage.getItem('closeGamesOnly')==='true';

const conferences={SEC:new Set(['ALA','ARK','AUB','FLA','UGA','UK','LSU','MISS','MSST','MIZ','OU','SC','TENN','TEX','TA&M','VAN']),B1G:new Set(['ILL','IU','IOWA','MD','MICH','MSU','MINN','NEB','NU','OSU','ORE','PSU','PUR','RUTG','UCLA','USC','WASH','WIS']),BIG12:new Set(['ARIZ','ASU','BAY','BYU','CIN','COL','HOU','ISU','KU','KSU','OKST','TCU','TTU','UCF','UTAH','WVU']),ACC:new Set(['BC','CAL','CLEM','DUKE','FSU','GT','LOU','MIA','UNC','NCST','PITT','SMU','STAN','SYR','UVA','VT','WAKE'])};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rankOf(c){const r=c?.curatedRank?.current;return Number.isFinite(r)&&r>0&&r<=25?r:null}function logoOf(c){const t=c?.team||{};return t.logo||t?.logos?.[0]?.href||''}function colorOf(c){const raw=c?.team?.color||c?.team?.alternateColor||'31445a';return '#'+String(raw).replace('#','')}function recordOf(c){return c?.records?.[0]?.summary||''}function spreadOf(comp){const o=comp?.odds?.[0];return o?(o.details||''):''}function teamAbbr(c){const t=c?.team||{};return t.abbreviation||t.shortDisplayName||t.displayName||'TBD'}function hasPossession(comp,c){const p=comp?.situation?.possession;return !!p&&(p===c?.id||p===c?.team?.id)}
function normalize(ev,league){const comp=ev?.competitions?.[0]||{},teams=comp.competitors||[],away=teams.find(t=>t.homeAway==='away')||teams[0]||{},home=teams.find(t=>t.homeAway==='home')||teams[1]||{},state=ev?.status?.type?.state||'pre',completed=!!ev?.status?.type?.completed,situation=comp?.situation||{},as=parseFloat(away?.score),hs=parseFloat(home?.score);return{ev,comp,away,home,league,state,completed,live:state==='in'&&!completed,start:new Date(ev?.date),detail:ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'',network:comp?.broadcasts?.[0]?.names?.[0]||'',situation,awayScore:Number.isFinite(as)?as:null,homeScore:Number.isFinite(hs)?hs:null}}
function statusOf(x){if(x.state==='pre')return x.start.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' • '+x.start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(x.completed)return'FINAL';return x.detail||'LIVE'}function resultClasses(x){if(!x.completed||x.awayScore===null||x.homeScore===null||x.awayScore===x.homeScore)return{away:'',home:''};return x.awayScore>x.homeScore?{away:'winner',home:'loser'}:{away:'loser',home:'winner'}}function isRedZone(x){return!!(x.situation?.isRedZone||x.situation?.redZone)}function closeGame(x){if(!x.live||x.awayScore===null||x.homeScore===null)return false;const diff=Math.abs(x.awayScore-x.homeScore),period=x.ev?.status?.period||0;return period>=4&&diff<=8}function favoriteGame(x){return favorites.has(teamAbbr(x.away))||favorites.has(teamAbbr(x.home))}
function urgency(x){if(saturdayMode){if(isRedZone(x))return 0;if(closeGame(x))return 1;if(favoriteGame(x)&&x.live)return 2;if(x.live)return 3;const mins=(x.start-Date.now())/60000;if(x.state==='pre'&&mins>=0&&mins<=90)return 4;if(rankOf(x.away)||rankOf(x.home))return 5;if(x.completed)return 7;return 6}if(favoriteGame(x))return 0;if(isRedZone(x))return 1;if(closeGame(x))return 2;if(x.live)return 3;if(x.state==='pre')return 4;return 5}
function confFor(x){if(x.league==='NFL')return'NFL';if(sec.some(e=>e.id===x.ev?.id))return'SEC';const vals=[teamAbbr(x.away),teamAbbr(x.home)];for(const [name,set] of Object.entries(conferences))if(vals.some(v=>set.has(v)))return name;return'CFB'}function confClass(c){return c==='SEC'?'sec':c==='B1G'?'b1g':c==='BIG12'?'big12':c==='ACC'?'acc':c==='NFL'?'nfl':''}
function situationText(x){if(!x.live)return'';const s=x.situation||{},parts=[];if(s.downDistanceText)parts.push(s.downDistanceText);else if(s.shortDownDistanceText)parts.push(s.shortDownDistanceText);if(s.possessionText)parts.push(s.possessionText);if(isRedZone(x))parts.push('RED ZONE');return parts.join(' • ')}
function teamHtml(c,x,side,rc){const t=c?.team||{},logo=logoOf(c),rank=rankOf(c),abbr=teamAbbr(c),score=(c?.score!==undefined&&c?.score!==null&&c?.score!=='')?c.score:'—',poss=hasPossession(x.comp,c),key=(x.ev?.id||'')+'-'+side,flash=scoreChanges.has(key)?'flash':'',fav=favorites.has(abbr);return`<div class="team ${side} ${rc}">${fav?`<button class="favorite-star on" data-team="${esc(abbr)}" title="Favorite team">★</button>`:''}${logo?`<img class="watermark" src="${esc(logo)}" alt="">`:''}<div class="logo-wrap">${logo?`<img class="logo" src="${esc(logo)}" alt="">`:''}</div><div class="rankname">${rank?`<span class="rank">${rank}</span>`:''}${esc(abbr)}</div><div class="record">${esc(recordOf(c)||'')}</div><div class="score ${flash}">${esc(score)}</div>${poss?'<div class="possession"></div>':''}</div>`}
function cardHtml(x){const rc=resultClasses(x),spread=spreadOf(x.comp),rz=isRedZone(x),conf=confFor(x),badge=x.live?`<div class="badge live"><span class="dotlive"></span>LIVE</div>`:`<div class="badge">${esc(x.league)}</div>`,sit=situationText(x),showConf=conf&&conf!==x.league;return`<article class="card ${x.live?'live':''} ${rz?'redzone':''}" style="--away:${esc(colorOf(x.away))};--home:${esc(colorOf(x.home))}"><div class="card-head"><div class="badges">${badge}${showConf?`<div class="conf-badge ${confClass(conf)}">${esc(conf)}</div>`:''}${rz?'<div class="badge redzone">RED ZONE</div>':''}</div><div class="card-meta"><div class="status">${esc(statusOf(x))}</div><div class="network">${esc(x.network||'')}</div></div></div><div class="matchup">${teamHtml(x.away,x,'away',rc.away)}${teamHtml(x.home,x,'home',rc.home)}</div><div class="card-foot">${sit?esc(sit):esc(x.completed?'FINAL':spread||x.network||'')}</div></article>`}
function currentGames(){let arr=[];if(mode==='all'){arr.push(...nfl.map(e=>normalize(e,'NFL')),...cfb.map(e=>normalize(e,'CFB')))}else if(mode==='nfl')arr=nfl.map(e=>normalize(e,'NFL'));else if(mode==='cfb')arr=cfb.map(e=>normalize(e,'CFB'));else if(mode==='top25')arr=cfb.map(e=>normalize(e,'CFB')).filter(x=>rankOf(x.away)||rankOf(x.home));else arr=sec.map(e=>normalize(e,'SEC'));const seen=new Set();arr=arr.filter(x=>{const id=x.ev?.id||`${x.start}-${x.away?.team?.id}-${x.home?.team?.id}`;if(seen.has(id))return false;seen.add(id);return true});if(closeGamesOnly)arr=arr.filter(closeGame);arr.sort((a,b)=>urgency(a)-urgency(b)||a.start-b.start);return arr}
function miniHtml(x){const a=x.away,h=x.home,al=logoOf(a),hl=logoOf(h),ar=rankOf(a),hr=rankOf(h);return`<div class="mini">${al?`<img class="minilogo" src="${esc(al)}" alt="">`:''}<span class="minirank">${ar||''}</span><span class="miniteam">${esc(teamAbbr(a))}</span><span class="miniscore">${esc(a?.score||'—')}</span><span>•</span>${hl?`<img class="minilogo" src="${esc(hl)}" alt="">`:''}<span class="minirank">${hr||''}</span><span class="miniteam">${esc(teamAbbr(h))}</span><span class="miniscore">${esc(h?.score||'—')}</span><span class="ministatus">${esc(x.completed?'FINAL':x.live?x.detail:statusOf(x))}</span></div>`}
function renderMain(){const arr=currentGames();if(!arr.length){track.innerHTML=`<div class="empty">${closeGamesOnly?'No close fourth-quarter games right now.':'No games in this scoreboard window.'}</div>`;track.style.animation='none';return}const cards=arr.map(cardHtml).join('');track.innerHTML=`<div class="group">${cards}</div><div class="group" aria-hidden="true">${cards}</div>`;track.style.animation='';track.classList.toggle('paused',paused);bindStars()}
function stripGames(){const top=cfb.map(e=>normalize(e,'CFB')).filter(x=>rankOf(x.away)||rankOf(x.home));if(stripMode===0)return{title:'TOP 25',sub:'LIVE SCORES',games:top};if(stripMode===1)return{title:'SEC',sub:'SCOREBOARD',games:sec.map(e=>normalize(e,'SEC'))};return{title:'NFL',sub:'SCOREBOARD',games:nfl.map(e=>normalize(e,'NFL'))}}
function renderMini(){const info=stripGames();$('stripTitle').textContent=info.title;$('stripSubtitle').textContent=info.sub;const arr=info.games.sort((a,b)=>urgency(a)-urgency(b)||a.start-b.start).slice(0,22);if(!arr.length){miniTrack.innerHTML='<div class="mini"><span class="miniteam">No games in current feed</span></div>';return}const items=arr.map(miniHtml).join('');miniTrack.innerHTML=`<div class="minigroup">${items}</div><div class="minigroup" aria-hidden="true">${items}</div>`}
function renderControls(){['allBtn','nflBtn','cfbBtn','top25Btn','secBtn'].forEach(id=>$(id).classList.remove('active'));const activeId={all:'allBtn',nfl:'nflBtn',cfb:'cfbBtn',top25:'top25Btn',sec:'secBtn'}[mode]||'allBtn';$(activeId).classList.add('active');$('satBtn').classList.toggle('active',saturdayMode);$('closeGameBtn').classList.toggle('active',closeGamesOnly);$('pauseBtn').textContent=paused?'RESUME':'PAUSE'}function setMode(m){mode=m;localStorage.setItem('footballMode',m);renderControls();renderMain()}function setSpeed(){const s=speeds[speedIndex];document.documentElement.style.setProperty('--scroll',s.sec+'s');$('speedBtn').textContent=s.label;localStorage.setItem('speedIndex',speedIndex)}
function bindStars(){document.querySelectorAll('.favorite-star').forEach(btn=>btn.onclick=e=>{e.stopPropagation();toggleFavorite(btn.dataset.team)})}function toggleFavorite(team){favorites.has(team)?favorites.delete(team):favorites.add(team);localStorage.setItem('footballFavorites',JSON.stringify([...favorites]));renderMain();renderFavorites()}function collectTeams(){const map=new Map();[...nfl,...cfb].forEach(ev=>(ev?.competitions?.[0]?.competitors||[]).forEach(c=>{const ab=teamAbbr(c);if(!map.has(ab))map.set(ab,{abbr:ab,logo:logoOf(c)})}));return[...map.values()].sort((a,b)=>a.abbr.localeCompare(b.abbr))}function renderFavorites(){const teams=collectTeams();$('teamGrid').innerHTML=teams.map(t=>`<button class="fav-team ${favorites.has(t.abbr)?'on':''}" data-team="${esc(t.abbr)}">${t.logo?`<img src="${esc(t.logo)}" alt="">`:''}<span>${favorites.has(t.abbr)?'★':'☆'} ${esc(t.abbr)}</span></button>`).join('');document.querySelectorAll('.fav-team').forEach(btn=>btn.onclick=()=>toggleFavorite(btn.dataset.team))}

function scoringLabel(delta){
  if(delta===6)return 'TOUCHDOWN';
  if(delta===3)return 'FIELD GOAL';
  if(delta===2)return 'TWO POINTS';
  if(delta===1)return 'EXTRA POINT';
  return 'SCORE';
}
function enqueueScoreAlert(x,side,oldScore,newScore){
  const c=side==='away'?x.away:x.home;
  const opp=side==='away'?x.home:x.away;
  const delta=Math.max(0,Number(newScore)-Number(oldScore));
  scoreAlertQueue.push({
    team:teamAbbr(c),
    logo:logoOf(c),
    color:colorOf(c),
    score:String(newScore),
    opponent:teamAbbr(opp),
    delta,
    label:scoringLabel(delta)
  });
  playNextScoreAlert();
}
function playNextScoreAlert(){
  if(scoreAlertPlaying||!scoreAlertQueue.length)return;
  scoreAlertPlaying=true;
  const a=scoreAlertQueue.shift();
  const el=$('scoreAlert');
  el.style.setProperty('--alert-color',a.color||'#173d75');
  $('alertKicker').textContent='SCORE ALERT';
  $('alertLogo').src=a.logo||'';
  $('alertLogo').style.display=a.logo?'block':'none';
  $('alertTeam').textContent=a.team;
  $('alertScore').textContent=a.score;
  $('alertSub').textContent=`${a.label} • ${a.team} vs ${a.opponent}`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  el.setAttribute('aria-hidden','false');
  setTimeout(()=>{
    el.classList.remove('show');
    el.setAttribute('aria-hidden','true');
    scoreAlertPlaying=false;
    setTimeout(playNextScoreAlert,250);
  },4800);
}

function scoreAlertGamesForMode(){
  if(mode==='nfl')return nfl.map(e=>normalize(e,'NFL'));
  if(mode==='cfb')return cfb.map(e=>normalize(e,'CFB'));
  if(mode==='top25')return cfb.map(e=>normalize(e,'CFB')).filter(x=>rankOf(x.away)||rankOf(x.home));
  if(mode==='sec')return sec.map(e=>normalize(e,'SEC'));
  return [...nfl.map(e=>normalize(e,'NFL')),...cfb.map(e=>normalize(e,'CFB'))];
}
function detectScoreChanges(){
  scoreChanges.clear();
  const eligibleIds=new Set(scoreAlertGamesForMode().map(x=>x.ev?.id||''));
  [...nfl.map(e=>normalize(e,'NFL')),...cfb.map(e=>normalize(e,'CFB'))].forEach(x=>{
    const id=x.ev?.id||'';
    [['away',x.away],['home',x.home]].forEach(([side,c])=>{
      const key=id+'-'+side;
      const val=String(c?.score??'');
      const old=previousScores[key];
      if(old!==undefined && old!==val){
        scoreChanges.add(key);
        const oldNum=parseFloat(old),newNum=parseFloat(val);
        if(eligibleIds.has(id)&&Number.isFinite(oldNum)&&Number.isFinite(newNum)&&newNum>oldNum){
          enqueueScoreAlert(x,side,oldNum,newNum);
        }
      }
      previousScores[key]=val;
    });
  });
  if(scoreChanges.size){
    setTimeout(()=>{scoreChanges.clear();renderMain();},2300);
  }
}
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function refresh(){const r=await Promise.allSettled([get(NFL_URL),get(CFB_URL),get(SEC_URL)]);let ok=0;if(r[0].status==='fulfilled'){nfl=r[0].value?.events||[];ok++}if(r[1].status==='fulfilled'){cfb=r[1].value?.events||[];ok++}if(r[2].status==='fulfilled'){sec=r[2].value?.events||[];ok++}detectScoreChanges();$('health').innerHTML=ok===3?'<span class="healthdot"></span>Live feeds connected':'<span class="healthdot err"></span>One or more feeds unavailable';renderMain();renderMini();renderFavorites()}
$('allBtn').onclick=()=>setMode('all');$('nflBtn').onclick=()=>setMode('nfl');$('cfbBtn').onclick=()=>setMode('cfb');$('top25Btn').onclick=()=>setMode('top25');$('secBtn').onclick=()=>setMode('sec');$('satBtn').onclick=()=>{saturdayMode=!saturdayMode;localStorage.setItem('saturdayMode',String(saturdayMode));renderControls();renderMain()};$('closeGameBtn').onclick=()=>{closeGamesOnly=!closeGamesOnly;localStorage.setItem('closeGamesOnly',String(closeGamesOnly));renderControls();renderMain()};$('favBtn').onclick=()=>{$('favModal').classList.add('open');renderFavorites()};$('closeFav').onclick=()=>$('favModal').classList.remove('open');$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'RESUME':'PAUSE';track.classList.toggle('paused',paused)};$('speedBtn').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;setSpeed()};
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){const fs=[...document.querySelectorAll('button')].filter(b=>b.offsetParent!==null),i=fs.indexOf(document.activeElement);if(i>=0){e.preventDefault();fs[e.key==='ArrowRight'?(i+1)%fs.length:(i-1+fs.length)%fs.length].focus()}}});setInterval(()=>{const d=new Date();$('clock').innerHTML=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}).toUpperCase()+'<br>'+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);setInterval(refresh,30000);setInterval(()=>{stripMode=(stripMode+1)%3;renderMini()},15000);setSpeed();renderControls();refresh();
})();
</script>

<div class="score-alert" id="scoreAlert" aria-hidden="true">
  <div class="score-alert-bg"></div>
  <div class="score-alert-grid"></div>
  <div class="score-alert-lines"></div>
  <div class="pixel-football"></div>
  <div class="alert-content">
    <div class="alert-kicker" id="alertKicker">SCORE ALERT</div>
    <div class="alert-logo-wrap"><img class="alert-logo" id="alertLogo" alt=""></div>
    <div class="alert-team" id="alertTeam">TEAM</div>
    <div class="alert-score" id="alertScore">0</div>
    <div class="alert-sub" id="alertSub"></div>
  </div>
  <div class="alert-bars"></div>
</div>
