<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Live Ticker</title>
<style>
:root{
  --bg:#050608;
  --panel:#0e1218;
  --panel2:#151b24;
  --text:#f8fafc;
  --muted:#aab3c0;
  --line:#2b3442;
  --live:#ff3b3b;
  --ok:#46d47a;
  --ticker-speed:260s;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{display:flex;flex-direction:column}
.top{
  height:12vh;min-height:82px;
  display:flex;align-items:center;gap:16px;
  padding:0 2vw;
  background:#080b10;
  border-bottom:1px solid var(--line);
}
.title{
  font-size:clamp(28px,2.8vw,50px);
  font-weight:1000;
  letter-spacing:.045em;
  white-space:nowrap;
}
.controls{margin-left:auto;display:flex;align-items:center;gap:10px}
button{
  border:1px solid #394557;background:#171d27;color:#fff;border-radius:12px;
  padding:12px 16px;font-size:clamp(13px,1vw,18px);font-weight:1000;cursor:pointer
}
button.active{background:#f7f9fc;color:#090b0f;border-color:#f7f9fc}
.clock{min-width:100px;text-align:right;font-size:18px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.ticker{
  flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;
  background:radial-gradient(circle at center, rgba(45,58,76,.12), transparent 55%),linear-gradient(180deg,#080a0e,#050608)
}
.viewport{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center}
.track{display:flex;width:max-content;will-change:transform;animation:scroll var(--ticker-speed) linear infinite}
.track.paused{animation-play-state:paused}
.group{display:flex;align-items:center;width:max-content}
.game{
  position:relative;display:flex;align-items:center;width:900px;height:58vh;min-height:350px;max-height:590px;
  margin-right:24px;border:1px solid var(--line);border-radius:28px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.02),transparent 30%),linear-gradient(135deg,var(--panel),var(--panel2));
  box-shadow:0 18px 55px rgba(0,0,0,.35)
}
.game.live{border-color:#713235;box-shadow:0 18px 55px rgba(0,0,0,.35), inset 0 0 45px rgba(255,59,59,.035)}
.accent{position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--team-accent,#687384)}
.game-meta{
  position:absolute;top:18px;left:36px;right:28px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;color:var(--muted);font-size:clamp(15px,1.15vw,21px);font-weight:1000;letter-spacing:.045em;text-transform:uppercase
}
.meta-right{max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.live-pill{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--live);color:white;font-size:.9em}
.game-main{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;padding:64px 34px 24px 40px}
.team{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:20px;min-width:0}
.team + .team{border-left:1px solid #303947;padding-left:28px}
.logo{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.team-info{min-width:0}
.abbr{font-size:clamp(34px,3vw,58px);line-height:1;font-weight:1000;white-space:nowrap}
.rank{color:#ffd76a;font-size:.5em;vertical-align:top;margin-right:6px}
.poss{display:inline-block;margin-left:10px;color:#ffd166;font-size:.37em;vertical-align:middle}
.sub{margin-top:10px;color:var(--muted);font-size:clamp(16px,1.15vw,22px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{min-width:100px;text-align:right;font-size:clamp(58px,5.2vw,96px);line-height:1;font-weight:1000;font-variant-numeric:tabular-nums}
.footer{
  height:8vh;min-height:54px;display:flex;align-items:center;gap:22px;padding:0 2vw;background:#080b10;
  border-top:1px solid var(--line);color:var(--muted);font-size:clamp(13px,1vw,17px);font-weight:700
}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px}
.dot.err{background:var(--live)}
.right{margin-left:auto;text-align:right}
.empty{padding-left:5vw;color:var(--muted);font-size:36px;font-weight:1000}
.toast{position:fixed;right:20px;bottom:72px;z-index:50;background:#1b2330;border:1px solid #40506a;border-radius:14px;padding:13px 18px;display:none}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:1050px){
  .title{font-size:24px}
  button{padding:9px 10px;font-size:12px}
  .clock{display:none}
  .game{width:760px}
  .team{grid-template-columns:78px minmax(0,1fr) auto;gap:15px}
  .logo{width:74px;height:74px}
  .game-main{padding-left:32px;padding-right:26px}
}
</style>
</head>
<body>
<header class="top">
  <div class="title">FOOTBALL LIVE</div>
  <div class="controls">
    <button id="bothBtn" class="active">ALL</button>
    <button id="nflBtn">NFL</button>
    <button id="cfbBtn">COLLEGE</button>
    <button id="secBtn">SEC</button>
    <button id="top25Btn">TOP 25: OFF</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="speedBtn">SPEED: 0.5×</button>
    <button id="fullBtn">FULLSCREEN</button>
  </div>
  <div id="clock" class="clock">--:--</div>
</header>

<main class="ticker">
  <div class="viewport">
    <div id="track" class="track">
      <div class="empty">Loading football…</div>
    </div>
  </div>
</main>

<footer class="footer">
  <span id="health"><span class="dot"></span>Connecting</span>
  <span id="updated">Last update: —</span>
  <span class="right">Updates every 30 seconds</span>
</footer>

<div id="toast" class="toast"></div>

<script>
(() => {
  const NFL_URL='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100';
  const CFB_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=200';
  const SEC_URL='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&limit=100';
  const REFRESH_MS=30000;

  let nfl=[], cfb=[], sec=[];
  let mode='both', top25Only=false, paused=false;

  const speedSteps=[
    {label:'0.25×',seconds:420},
    {label:'0.5×',seconds:260},
    {label:'1×',seconds:150},
    {label:'2×',seconds:82},
    {label:'3×',seconds:55}
  ];
  let speedIndex=1;

  const $=id=>document.getElementById(id);
  const track=$('track');

  function esc(v=''){
    return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function rankOf(c){
    const r=c?.curatedRank?.current;
    return Number.isFinite(r)&&r>0&&r<=25?r:null;
  }
  function recordOf(c){return c?.records?.[0]?.summary||''}
  function colorOf(c){
    const raw=c?.team?.color||c?.team?.alternateColor||'';
    return raw?'#'+raw.replace('#',''):'#687384';
  }
  function hasPossession(comp,c){
    const p=comp?.situation?.possession;
    return !!p&&(c?.id===p||c?.team?.id===p);
  }
  function spreadOf(comp){
    const o=comp?.odds?.[0];
    return o?(o.details||o.spread||''):'';
  }
  function normalize(ev,league){
    const comp=ev?.competitions?.[0]||{};
    const cs=comp.competitors||[];
    const away=cs.find(x=>x.homeAway==='away')||cs[0]||{};
    const home=cs.find(x=>x.homeAway==='home')||cs[1]||{};
    const state=ev?.status?.type?.state||'pre';
    const completed=!!ev?.status?.type?.completed;
    return {
      ev,comp,away,home,league,state,completed,
      live:state==='in'&&!completed,
      detail:ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'',
      start:new Date(ev?.date),
      broadcast:comp?.broadcasts?.[0]?.names?.[0]||''
    };
  }
  function statusText(x){
    if(x.state==='pre'){
      return x.start.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' • '+
        x.start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    }
    if(x.completed) return 'FINAL';
    return x.detail||'LIVE';
  }
  function teamHtml(c,comp){
    const t=c?.team||{};
    const logo=t.logo||t?.logos?.[0]?.href||'';
    const name=t.abbreviation||t.shortDisplayName||t.displayName||'TBD';
    const r=rankOf(c), rec=recordOf(c), poss=hasPossession(comp,c);
    const score=(c?.score!==undefined&&c?.score!==null&&c?.score!=='')?c.score:'—';
    return `<div class="team">
      ${logo?`<img class="logo" src="${esc(logo)}" alt="">`:'<div></div>'}
      <div class="team-info">
        <div class="abbr">${r?`<span class="rank">${r}</span>`:''}${esc(name)}${poss?'<span class="poss">●</span>':''}</div>
        <div class="sub">${esc(rec||t.shortDisplayName||'')}</div>
      </div>
      <div class="score">${esc(score)}</div>
    </div>`;
  }
  function gameCard(x){
    const bits=[statusText(x)];
    if(x.broadcast) bits.push(x.broadcast);
    const spread=spreadOf(x.comp);
    if(spread) bits.push(spread);
    return `<article class="game ${x.live?'live':''}" style="--team-accent:${esc(colorOf(x.home))}">
      <div class="accent"></div>
      <div class="game-meta">
        <span>${x.live?'<span class="live-pill">LIVE</span>':esc(x.league)}</span>
        <span class="meta-right">${esc(bits.join(' • '))}</span>
      </div>
      <div class="game-main">
        ${teamHtml(x.away,x.comp)}
        ${teamHtml(x.home,x.comp)}
      </div>
    </article>`;
  }
  function priority(x){
    if(x.live) return 0;
    if(x.state==='pre') return 1;
    return 2;
  }
  function currentData(){
    let arr=[];
    if(mode==='both'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    } else if(mode==='nfl'){
      arr.push(...nfl.map(e=>normalize(e,'NFL')));
    } else if(mode==='cfb'){
      arr.push(...cfb.map(e=>normalize(e,'CFB')));
    } else if(mode==='sec'){
      arr.push(...sec.map(e=>normalize(e,'SEC')));
    }

    if(top25Only && mode!=='nfl'){
      arr=arr.filter(x=>x.league==='NFL'||rankOf(x.away)||rankOf(x.home));
    }

    const seen=new Set();
    arr=arr.filter(x=>{
      const id=x.ev?.id||`${x.start}-${x.away?.team?.id}-${x.home?.team?.id}`;
      if(seen.has(id)) return false;
      seen.add(id);
      return true;
    });

    arr.sort((a,b)=>priority(a)-priority(b)||a.start-b.start);
    return arr;
  }
  function setSpeed(){
    const s=speedSteps[speedIndex];
    document.documentElement.style.setProperty('--ticker-speed',s.seconds+'s');
    $('speedBtn').textContent='SPEED: '+s.label;
  }
  function updateButtons(){
    ['bothBtn','nflBtn','cfbBtn','secBtn'].forEach(id=>$(id).classList.remove('active'));
    $({both:'bothBtn',nfl:'nflBtn',cfb:'cfbBtn',sec:'secBtn'}[mode]).classList.add('active');
    $('top25Btn').classList.toggle('active',top25Only);
    $('top25Btn').textContent=`TOP 25: ${top25Only?'ON':'OFF'}`;
    $('pauseBtn').classList.toggle('active',paused);
    $('pauseBtn').textContent=paused?'RESUME':'PAUSE';
  }
  function render(){
    updateButtons();
    const arr=currentData();

    if(!arr.length){
      track.innerHTML='<div class="empty">No games in the current scoreboard window.</div>';
      track.style.animation='none';
      return;
    }

    const cards=arr.map(gameCard).join('');
    track.innerHTML=`<div class="group">${cards}</div><div class="group" aria-hidden="true">${cards}</div>`;
    track.style.animation='';
    setSpeed();
    track.classList.toggle('paused',paused);
  }
  async function fetchJson(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  async function refresh(){
    const results=await Promise.allSettled([fetchJson(NFL_URL),fetchJson(CFB_URL),fetchJson(SEC_URL)]);
    let ok=0; const failures=[];
    if(results[0].status==='fulfilled'){nfl=results[0].value?.events||[];ok++;} else failures.push('NFL');
    if(results[1].status==='fulfilled'){cfb=results[1].value?.events||[];ok++;} else failures.push('College');
    if(results[2].status==='fulfilled'){sec=results[2].value?.events||[];ok++;} else failures.push('SEC');

    if(ok){
      $('updated').textContent='Last update: '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
    }
    if(ok===3) $('health').innerHTML='<span class="dot"></span>Live feeds connected';
    else if(ok>0) $('health').innerHTML=`<span class="dot err"></span>${esc(failures.join(', '))} feed unavailable`;
    else $('health').innerHTML='<span class="dot err"></span>Feeds unavailable — check internet/browser';

    render();
  }
  function toast(msg){
    const t=$('toast');t.textContent=msg;t.style.display='block';
    setTimeout(()=>t.style.display='none',2400);
  }

  $('bothBtn').onclick=()=>{mode='both';render()};
  $('nflBtn').onclick=()=>{mode='nfl';render()};
  $('cfbBtn').onclick=()=>{mode='cfb';render()};
  $('secBtn').onclick=()=>{mode='sec';render()};
  $('top25Btn').onclick=()=>{top25Only=!top25Only;render()};
  $('pauseBtn').onclick=()=>{paused=!paused;render()};
  $('speedBtn').onclick=()=>{speedIndex=(speedIndex+1)%speedSteps.length;setSpeed()};
  $('fullBtn').onclick=async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){
      toast('Fullscreen is blocked here. Use the browser fullscreen option.');
    }
  };

  setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);
  setInterval(refresh,REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  setSpeed();
  refresh();
})();
</script>
</body>
</html>
